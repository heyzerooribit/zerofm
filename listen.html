<section>
<h2>Listen live</h2>
<div class="card" id="player">
<div class="np"><div><small>Now playing</small><h3 id="now">ZeroFM Sampler</h3><small id="by">Generated live in your browser</small></div>
<button class="btn" id="play" aria-pressed="false">Play</button></div>
</div>
<p class="muted" style="margin-top:12px">The sampler plays until your stream is connected.</p>
<h3 style="margin:28px 0 10px">Request a song</h3>
<div class="card"><form id="req"><div class="row"><div><label for="s">Song</label><input type="text" id="s" required></div><div><label for="a">Artist</label><input type="text" id="a" required></div></div>
<label for="d">Dedication (optional)</label><input type="text" id="d"><button class="btn" type="submit">Send request</button><div id="ok" aria-live="polite"></div></form></div>
</section>


<footer>ZeroFM – Internet Radio · The Beginning of Sound</footer>
<script src="site.js"></script>
</body>
